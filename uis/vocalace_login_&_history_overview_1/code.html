<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Live Speech-to-Text Session</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;family=Noto+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0066ff",
                        "recording-bg": "#1a1a2e",
                        "transcript-bg": "#121212",
                        "accent-orange": "#ff9500",
                        "accent-green": "#34c759",
                        "accent-red": "#ff3b30",
                        "accent-gray": "#8e8e93"
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"],
                        "sans": ["Noto Sans", "sans-serif"],
                        "mono": ["JetBrains Mono", "monospace"]
                    }
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        @layer utilities {
            .waveform-bar {
                @apply bg-primary rounded-full;
                box-shadow: 0 0 10px rgba(0, 102, 255, 0.6);
            }
            .pulsing-dot {
                @apply bg-accent-red rounded-full;
                animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
            }
            @keyframes pulse {
                0%, 100% { opacity: 1; transform: scale(1); }
                50% { opacity: 0.4; transform: scale(1.2); }
            }
            .vu-segment {
                @apply h-1 w-full rounded-sm mb-0.5;
            }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-black font-sans text-white overflow-hidden">
<div class="flex flex-col h-screen max-w-[480px] mx-auto bg-black relative">
<div class="h-1/2 bg-gradient-to-b from-[#1a1a2e] to-[#0f0f1e] flex flex-col p-6 relative">
<div class="flex justify-between items-center mb-4">
<div class="flex items-center gap-2">
<div class="pulsing-dot size-2"></div>
<span class="text-xs font-bold uppercase tracking-widest text-white/80">Live Recording Session</span>
</div>
<div class="text-xl font-mono font-medium text-white tabular-nums">00:42:15</div>
</div>
<div class="flex-grow flex items-center justify-center gap-1.5 px-4 h-32">
<div class="waveform-bar w-1.5 h-12"></div>
<div class="waveform-bar w-1.5 h-20"></div>
<div class="waveform-bar w-1.5 h-32"></div>
<div class="waveform-bar w-1.5 h-24"></div>
<div class="waveform-bar w-1.5 h-40"></div>
<div class="waveform-bar w-1.5 h-28"></div>
<div class="waveform-bar w-1.5 h-16"></div>
<div class="waveform-bar w-1.5 h-36"></div>
<div class="waveform-bar w-1.5 h-20"></div>
<div class="waveform-bar w-1.5 h-14"></div>
<div class="waveform-bar w-1.5 h-24"></div>
<div class="waveform-bar w-1.5 h-32"></div>
<div class="waveform-bar w-1.5 h-18"></div>
</div>
<div class="absolute right-6 top-1/2 -translate-y-1/2 w-3 flex flex-col-reverse h-32 gap-0.5">
<div class="vu-segment bg-accent-green"></div>
<div class="vu-segment bg-accent-green"></div>
<div class="vu-segment bg-accent-green"></div>
<div class="vu-segment bg-accent-green"></div>
<div class="vu-segment bg-accent-green"></div>
<div class="vu-segment bg-accent-orange"></div>
<div class="vu-segment bg-accent-orange"></div>
<div class="vu-segment bg-accent-red opacity-30"></div>
</div>
</div>
<div class="h-1/2 bg-transcript-bg border-t border-white/10 flex flex-col p-6 relative overflow-hidden">
<div class="flex justify-between items-center mb-6">
<h3 class="text-xs font-bold uppercase tracking-widest text-slate-500">Live Transcript</h3>
<span class="text-[10px] bg-primary/20 text-primary px-2 py-0.5 rounded uppercase font-bold">Auto-Analyzing</span>
</div>
<div class="flex-grow font-mono text-sm leading-relaxed overflow-y-auto space-y-4 pr-2">
<p class="text-slate-400">Interviewer: Could you explain how you handle distributed systems failures?</p>
<p class="text-white">
                    Candidate: Well, <span class="text-accent-orange border-b border-accent-orange/30">um</span>, when it comes to <span class="text-accent-green">idempotency</span> in <span class="text-accent-green">microservices</span>, I usually, <span class="text-accent-orange border-b border-accent-orange/30">like</span>, implement retry patterns with <span class="text-accent-green">exponential backoff</span>... 
                    <span class="inline-block w-2 h-4 bg-primary align-middle ml-1"></span>
</p>
</div>
<div class="mt-4 pt-6 pb-2 flex items-center justify-between border-t border-white/5">
<div class="flex gap-4 items-center">
<button class="bg-accent-red text-white flex items-center justify-center p-3 rounded-full hover:opacity-90 active:scale-95 transition-all">
<span class="material-symbols-outlined fill-1">stop</span>
</button>
<button class="bg-accent-gray text-white flex items-center justify-center p-3 rounded-full hover:opacity-90 active:scale-95 transition-all">
<span class="material-symbols-outlined fill-1">pause</span>
</button>
</div>
<div class="flex gap-5 items-center text-slate-400 pr-2">
<button class="hover:text-white transition-colors">
<span class="material-symbols-outlined text-[22px]">edit</span>
</button>
<button class="hover:text-white transition-colors">
<span class="material-symbols-outlined text-[22px]">save</span>
</button>
<button class="hover:text-white transition-colors">
<span class="material-symbols-outlined text-[22px]">ios_share</span>
</button>
</div>
</div>
</div>
<div class="bg-transcript-bg pb-2 flex justify-center">
<div class="w-32 h-1 bg-white/20 rounded-full"></div>
</div>
</div>

</body></html>
